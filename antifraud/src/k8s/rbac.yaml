apiVersion: v1
kind: ServiceAccount
metadata:
  name: antifraud-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: antifraud-role
rules:
  - apiGroups: [""]
    resources: ["configmaps","secrets"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: antifraud-rb
subjects:
  - kind: ServiceAccount
    name: antifraud-sa
roleRef:
  kind: Role
  name: antifraud-role
  apiGroup: rbac.authorization.k8s.io