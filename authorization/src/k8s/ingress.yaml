apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authorization-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /api/authorization/$1
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: authorization.example.com
    http:
      paths:
      - path: /api/authorization/(.*)
        pathType: Prefix
        backend:
          service:
            name: authorization-service
            port:
              number: 80
  tls:
  - hosts:
    - authorization.example.com
    secretName: authorization-tls 